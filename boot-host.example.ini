; Run boot tests on a machine that has KVM.
;
; Copy this file to boot-host.ini in the repository root and fill it in. That copy is
; gitignored and refused by the commit gates: it names YOUR machine and YOUR account,
; which is nobody else's business and must never reach a clone of this repository.
;
;     cp boot-host.example.ini boot-host.ini
;     chmod 600 boot-host.ini
;     $EDITOR boot-host.ini
;     ./kitchen boot-host check
;
; While it exists, every boot goes there -- `kitchen test`, `kitchen build`'s profile
; tests, ci/tier-c.sh and tools/qemu/boot.py. Nothing else changes: the evidence lands
; here, in the same place, with the same names.
;
; To boot here instead, for one command or for a shell:
;
;     KITCHEN_BOOT_HOST=local ./kitchen test out/x.iso --kernel
;
; REQUIREMENTS ON THE BOOT HOST. Key-based ssh login (this never asks for a password,
; and there is nowhere here to put one), a writable /dev/kvm, and qemu-system-x86_64,
; qemu-img, xorriso, e2fsprogs, rsync, python3 >= 3.9 -- plus ovmf for --uefi.
; `kitchen boot-host check` reports any of those that are missing, and names the fix.

[boot-host]

; The machine. A hostname, an IP address, or an alias from your ~/.ssh/config -- which
; is the place to put a username, a port or an identity file, because ssh already reads
; it and this file should not become a second, worse copy of it.
host = <kvm-host>

; A directory on that machine this account can write. Everything lives under
; <scratch>/boot-host/: the sent tree, a content-addressed ISO cache, one directory per
; run, and their evidence. Nothing outside it is touched, and `kitchen boot-host clean`
; empties it. Must be absolute, and short enough that a unix socket path fits inside it
; (`check` says so if it is not).
scratch = <absolute path on that host>

; Where a VNC server for tools/qemu/boot.py listens ON THE BOOT HOST. IP[:PORT], an
; address literal rather than a name, default 127.0.0.1:5900.
;
;   127.0.0.1:5900     reachable only from the boot host, so the viewer here is
;                      connected through an ssh tunnel. This is the default, and the
;                      right answer unless you know otherwise.
;   172.17.0.1:5900    an address of the boot host that this machine can already
;                      reach -- a docker bridge, a LAN address -- connected directly.
;
; A VNC server started this way has NO PASSWORD: whoever reaches it has the keyboard of
; the machine under test. So an address outside 127.0.0.0/8, ::1, 10/8, 172.16/12,
; 192.168/16 and fc00::/7 is refused unless you also say vnc_public = yes below, and
; every launch then says so out loud.
;vnc = 127.0.0.1:5900
;vnc_public = no

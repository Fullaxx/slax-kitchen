# ACTION VERSIONS ARE A NODE 24 FLOOR, not a preference. GitHub removes the Node 20
# runtime from runners on 2026-09-23; runners already default to Node 24 as of
# 2026-06-16. Every action here was checked against its own action.yml `runs.using`
# at the tag rather than assumed:
#
#   actions/checkout         v4 node20  ->  v5 first node24   (using v7)
#   actions/cache            v4 node20  ->  v5 first node24   (using v6)
#   actions/upload-artifact  v4 node20  ->  v6 first node24   (using v7)
#   actions/github-script    v7 node20  ->  v8 first node24   (using v9)
#
# Note upload-artifact v5 is STILL node20 -- bumping one major would not have fixed it.
# Do not drop any of these below the "first node24" column.
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/

name: ci

on:
  push:
    branches: [master]
  pull_request:
  # THE WEEKLY RUN IS THE FULL ONE. Two things are deliberately not on the per-push path
  # -- the all-browsers recipe and the two bootloader screenshot boots -- and this is
  # where they happen. Thursday so it does not collide with upstream-watch on Monday;
  # an off-the-hour minute for the same reason GitHub recommends it, cron congestion.
  schedule:
    - cron: "41 5 * * 4"      # Thursdays, 05:41 UTC
  workflow_dispatch:
  # release.yml calls this rather than restating it. A release therefore runs the
  # identical gates, the identical four-target matrix and the identical boot test --
  # there is no second copy that can quietly diverge from what master is tested with.
  workflow_call:

permissions:
  contents: read

# github.workflow is in the group because concurrency is evaluated in the CALLER's
# context: without it, a release dry-run dispatched from master lands in the same
# group as master's own CI and cancels it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- gates --
  # Fast, no ISOs, no network beyond apt. Runs the exact same scripts the local
  # pre-commit hook runs -- ci/checks/*.sh is the single implementation, so a hook
  # can never drift from CI.
  gates:
    name: commit gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true          # 20-vendor-pristine needs the submodule present
      # containers/packages/*.txt is the list, and the reference container installs
      # the same files. This used to be three inline copies here plus a fourth in
      # docs/40-workflow/toolchain.md, and they had already drifted apart.
      #
      # `cat ... | grep`, not a multi-file `grep -h`: ugrep -- which some machines
      # have installed as `grep` -- searches files in parallel, so a multi-file grep
      # emits them in nondeterministic order. apt does not care; a log that reorders
      # itself between runs is still not worth shipping.
      - name: install lint tooling
        run: |
          sudo apt-get update -qq
          cat containers/packages/lint.txt \
            | grep -v -e '^#' -e '^$' \
            | xargs sudo apt-get install -y --no-install-recommends
      - run: ./ci/run-checks.sh ci

  # ------------------------------------------------------------- container --
  # The reference container is what docs/ cites for every capability measurement,
  # and what containers/packages/*.txt is written for. An image nobody builds rots,
  # so build it here and make it prove itself: `doctor --strict` exits non-zero on a
  # missing tool or a failed toolchain assertion, and the gates then run inside it.
  #
  # Parallel with the build matrix and far shorter than it, so this costs no wall
  # clock. Not merged INTO a build job on purpose: this one must fail for a reason
  # about the image, not about a recipe.
  container:
    name: reference container (${{ matrix.base }})
    runs-on: ubuntu-24.04
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        # Both supported bases, because containers/README.md claims any current
        # Debian-family release works and a claim nobody runs is an assumption.
        # debian:12 is not decoration: it is what upstream actually builds Slax on.
        base: [ubuntu:24.04, "debian:12"]
    steps:
      - uses: actions/checkout@v7
        with: {submodules: true}
      - run: |
          docker build -f containers/Containerfile \
            --build-arg BASE=${{ matrix.base }} -t slax-kitchen:ci containers/
      - name: the image can build a Slax, and says so
        # `set -e` is load-bearing. `sh -c 'a; b'` exits with b's status, so without
        # it a failing `doctor --strict` was swallowed whole by the passing gates
        # that followed -- verified, this step reported success with mcopy deleted.
        #
        # safe.directory because the runner checks out as uid 1001 and the container
        # is root. This line is load-bearing, and for a worse reason than first written
        # here: the original comment claimed the gates "die with git's dubious-ownership
        # message". Measured 2026-09-16 -- they did not die. check_files() returned the
        # EMPTY SET, so five gates looped over nothing and reported SUCCESS on a tree
        # with a planted violation in it. ci/lib.sh now refuses to run when git will not
        # answer, so dropping this line fails the job loudly instead of silently.
        run: |
          docker run --rm -v "$PWD:/work" -w /work slax-kitchen:ci sh -c '
            set -e
            git config --global --add safe.directory /work
            ./kitchen doctor --strict
            ./ci/run-checks.sh ci
          '
      - name: what it actually installed
        run: docker run --rm slax-kitchen:ci head -5 /etc/slax-kitchen-toolchain.txt

  # ----------------------------------------------------------------- build --
  # One job per supported target. This is what catches a recipe that silently only
  # works on 64-bit Debian.
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: debian-64bit-12.2.0
            iso: slax-64bit-debian-12.2.0.iso
          - target: debian-32bit-12.2.0
            iso: slax-32bit-debian-12.2.0.iso
          - target: slackware-64bit-15.0.4
            iso: slax-64bit-slackware-15.0.4.iso
          - target: slackware-32bit-15.0.4
            iso: slax-32bit-slackware-15.0.4.iso
    steps:
      - uses: actions/checkout@v7
        with: {submodules: true}

      - name: install toolchain
        run: |
          sudo apt-get update -qq
          cat containers/packages/build.txt \
            | grep -v -e '^#' -e '^$' \
            | xargs sudo apt-get install -y --no-install-recommends

      # The base ISOs are 416-476 MiB each and never change -- upstream has not shipped
      # a release since 2023 -- so cache on the content hash and download at most once.
      - name: cache base ISO
        id: cache-iso
        uses: actions/cache@v6
        with:
          path: isos/${{ matrix.iso }}
          key: iso-${{ matrix.target }}-${{ hashFiles('compat/sources.yaml') }}

      - name: fetch base ISO
        if: steps.cache-iso.outputs.cache-hit != 'true'
        run: ./kitchen fetch ${{ matrix.target }}

      - name: verify base ISO
        run: ./kitchen fetch ${{ matrix.target }} --verify-only

      # A stock ISO must match its committed fingerprint. If this fails, either upstream
      # republished something or the fingerprint is wrong -- both worth knowing.
      - name: probe stock ISO
        run: ./kitchen probe isos/${{ matrix.iso }}

      # initramfs-busybox installs a binary that is deliberately NOT in the repository:
      # a 1.2 MB blob that runs as root at boot should be built from pinned source rather
      # than committed. (.gitignore keeps build/ out; 00-no-binaries would not.) Cache it on the build script
      # and the version it pins, so it is built once rather than four times.
      - name: cache busybox build
        id: cache-busybox
        uses: actions/cache@v6
        with:
          path: build/
          key: busybox-${{ hashFiles('tools/build-busybox.sh') }}

      - name: build static i386 busybox
        if: steps.cache-busybox.outputs.cache-hit != 'true'
        run: ./tools/build-busybox.sh --check-parity

      # Gates 1-3 for the busybox replacement. These are millisecond checks, not boot
      # tests, because the shipped i386 busybox executes directly on an x86_64 runner --
      # so the 2017 binary is available as a reference oracle and the candidate can be
      # diffed against it. Run per target, which also confirms bin/busybox really is
      # byte-identical across all four images.
      - name: busybox gates
        run: |
          mkdir -p build/irfs
          xorriso -osirrox on -indev "isos/${{ matrix.iso }}" \
                  -extract /slax/boot/initrfs.img build/initrfs.img --
          # ONLY the four files the gates read. A full cpio extraction tries to create
          # the initramfs's seven device nodes, which a non-root runner (uid 1001)
          # cannot do -- cpio then exits non-zero and `bash -e` kills the step. The
          # first version also sent cpio's stderr to /dev/null, so the reason was
          # invisible and the step just said "exit code 2".
          ( cd build/irfs && xz -dc ../initrfs.img \
              | cpio -id --quiet bin/busybox bin/blkid bin/eject lib/livekitlib )
          ./tests/busybox/gates.sh build/busybox-1.37.0-i386-static build/irfs

      # GATE 5, the rollback proof, and it was never a host task. HOST_TASKS had it
      # filed under "busybox gates 4-5 + a real-hardware bench"; INITIAL_PLAN defines it
      # as "re-apply with the stock blob and confirm the ISO returns to its committed
      # fingerprint -- seconds". No KVM, no hardware. It sat in the host queue for
      # months because of a label.
      #
      # sudo because it repacks the initramfs, and cpio needs CAP_MKNOD for the seven
      # device nodes -- which is also why it is a separate step from the gates above,
      # whose whole point is that they need no privilege. It skips rather than fails
      # without root, so a fork running this unprivileged still gets gates 1-3.
      #
      # It earned its place on the first run: it found that initramfs.busybox was
      # DELETING bin/init -> ../init, a symlink upstream's initramfs_create:155 puts
      # back after line 68 removes the busybox-generated one. The verb copied line 68
      # and missed line 155.
      - name: busybox gate 5 (rollback proof)
        run: |
          sudo ./tests/busybox/gates.sh build/busybox-1.37.0-i386-static \
               build/irfs build/initrfs.img
          sudo chown -R "$(id -u):$(id -g)" build

      # Apply every compatible recipe individually, so one failure names one recipe.
      # Recipes that need a chroot are run under sudo; runners allow it.
      #
      # MATRIX_SKIP is set on push and EMPTY on schedule/dispatch, so the weekly run
      # builds everything. What it leaves out and why is in ci/slow-recipes.txt, and every
      # skip is printed with its reason -- a matrix that quietly ran less than it looks
      # like would be worse than a slow one.
      - name: recipe matrix
        env:
          # THE NON-EMPTY VALUE MUST SIT ON THE `&&` SIDE. `cond && '' || 'file'` looks
          # like a ternary and is not one: GitHub's && returns its right operand only if
          # the left is truthy, and the EMPTY STRING IS FALSY, so that form falls through
          # to 'file' in both branches and the weekly run would skip too. Written the
          # other way round, the truthy value is the one being selected and it works.
          #
          # A tag push is a release (release.yml calls this workflow), and a release
          # verifies everything -- so tags get the full matrix like the weekly run does.
          MATRIX_SKIP: >-
            ${{ (github.event_name == 'pull_request'
                 || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')))
                && 'ci/slow-recipes.txt' || '' }}
        run: ./ci/recipe-matrix.sh ${{ matrix.target }} isos/${{ matrix.iso }}

      - name: round-trip fidelity
        run: ./ci/roundtrip.sh isos/${{ matrix.iso }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: logs-${{ matrix.target }}
          path: |
            out/**/*.log
            ci-logs/
          if-no-files-found: ignore

  # ------------------------------------------------------------------ boot --
  # Tier B. GitHub runners have no /dev/kvm, so QEMU falls back to TCG and a boot to
  # livekit takes minutes rather than seconds. Kept to one target and off the
  # per-push path for that reason.
  boot:
    name: boot test (TCG)
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'boot-test')
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with: {submodules: true}
      # boot.txt is additive to build.txt, not a replacement for it.
      - name: install toolchain
        run: |
          sudo apt-get update -qq
          cat containers/packages/build.txt containers/packages/boot.txt \
            | grep -v -e '^#' -e '^$' \
            | xargs sudo apt-get install -y --no-install-recommends
      - uses: actions/cache@v6
        with:
          path: isos/slax-64bit-debian-12.2.0.iso
          key: iso-debian-64bit-12.2.0-${{ hashFiles('compat/sources.yaml') }}
      - run: ./kitchen fetch debian-64bit-12.2.0
      # sudo because the profile now includes add-packages, and bundle.packages needs a
      # real chroot. lib/build.sh has no escalation of its own; ci/recipe-matrix.sh
      # already does exactly this for the same reason.
      #
      # The chown is not tidiness. Building as root leaves out/ owned by root:root 755,
      # and the NEXT step runs as the runner user (uid 1001) and writes screenshots and
      # logs into out/boot-tests/ -- which it cannot create inside a root-owned
      # directory. Without this the boot step dies on a permission error and the
      # evidence upload finds nothing.
      - run: |
          sudo ./kitchen build example --keep
          sudo chown -R "$(id -u):$(id -g)" out work
      # --kernel is the assertion; --bios/--uefi are evidence.
      #
      # A direct kernel boot puts the kernel on ttyS0 by construction and checks the
      # livekit markers, so it can actually fail. The menu modes cannot assert on
      # serial -- their default entry has no console=ttyS0, so the log stays empty --
      # and for four CI runs they reported success while proving nothing.
      #
      # The testkit expectations are the payload: "union: aufs" catches the silent
      # overlayfs downgrade that breaks `slax activate`, and the package count catches
      # a bundle whose var/lib/dpkg/status shadowed a more complete one -- a failure
      # that is invisible everywhere else until a user runs apt.
      #
      # 603, not 600, and that is the whole point. Until add-packages joined the profile
      # no recipe in it built a bundle, so merge_tree returned 0, no 98-dpkg-db.sb was
      # written, and 600 was 05-chromium's stock constant that nothing kitchen does
      # could move -- an assertion that could not fail for the reason it was written
      # for. Measured on debian-64bit: "98-dpkg-db.sb: 600 from 05-chromium.sb +
      # 1 fragment(s) -> 603 packages", and 98 sorts above 05 so that file is what the
      # union presents. This is now the only place anywhere that proves a GENERATED
      # dpkg database is what the booted system reads.
      #
      # It can now also fail for a second reason: an archive change that moves tmux or
      # ncdu's dependency closure. bookworm is frozen, so that should not happen -- but
      # if this ever fails while everything else passes, check that before suspecting
      # the bundle machinery.
      - name: boot (direct kernel, asserts livekit markers)
        run: |
          ./kitchen test out/slax-example-12.2.0.iso --kernel --seconds 240 \
            --expect '### TESTKIT BEGIN' \
            --expect 'union: aufs' \
            --expect 'dpkg-status: 603 packages'

      # TIER C, WEEKLY. Not on the per-push path: these are four more boots, and the
      # last pass cut this job from 8 minutes to 1 by not paying for boots nobody reads.
      #
      # These used to be two screenshot boots that asserted nothing -- their serial log
      # was empty because the bootloader's DEFAULT entry sets no console=ttyS0, so the
      # only way either could fail was a zero-byte PNG that nothing ever opened. They
      # assert now, for two reasons that had to be found rather than assumed:
      #
      #   * `kitchen test` points the bootloader at the entry `serial-console` adds, by
      #     reading the ISO's own menu. Not by counting arrow keys: the Slax isolinux
      #     menu sets MENU ROWS 5 so the serial entry is off-screen, and two entries are
      #     MENU DISABLED so navigation skips them. Esc twice drops to the `boot:`
      #     prompt and the entry is typed by NAME.
      #   * `serial-console` used to end `console=ttyS0 console=tty0`, and /dev/console
      #     is the LAST console= -- so everything livekit printed went to the screen and
      #     the serial log held kernel messages only. Measured: 21 KB of log, zero
      #     livekit markers. Reversed, the entry does what its name says.
      #
      # CI can exercise this harness but can never BE the evidence: tests/boot/tier-c.json
      # is written by a KVM host, and the ledger here goes to a scratch path so a TCG run
      # cannot overwrite it. What CI does own is the golden diff -- every path must
      # assemble a filesystem identical to the committed testkit block.
      - name: Tier C boot matrix (weekly)
        if: >-
          github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
          || startsWith(github.ref, 'refs/tags/')
          || contains(github.event.pull_request.labels.*.name, 'boot-test')
        run: |
          ./kitchen build boot-matrix --no-test
          ./ci/tier-c.sh --seconds 300 --ledger out/tier-c/ci-ledger.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: boot-evidence
          path: |
            out/boot-tests/
            out/tier-c/
          if-no-files-found: warn

  # ------------------------------------------------------------ tor assets --
  # Proof that the publishing pipeline works end to end, on a real profile: build `tor`,
  # assemble what would travel with it, and verify that set. WEEKLY and dispatch only --
  # the Tor Browser tarball is 138 MB from dist.torproject.org.
  #
  # NOT ON TAGS, deliberately. release.yml's publish job needs the whole of this workflow,
  # so on a tag this job would stand between a release and `contents: write` -- and its
  # failure mode is external: a Tor Browser release retires the pinned tarball and the
  # download 404s. That is exactly why all-browsers and tor-browser are in
  # ci/slow-recipes.txt. A release must not wait on dist.torproject.org; the weekly run
  # is what proves the pipeline, and `workflow_dispatch` runs it on demand before a tag.
  #
  # THE ISO IS NEVER UPLOADED, and not by convention: --no-image leaves it out of the set,
  # and --assert-no-images fails the job if any asset is an ISO 9660 image, squashfs, ELF,
  # PE or FAT filesystem by CONTENT, whatever its name. The Tor Project's trademark policy
  # does not allow "Tor" in the name of another product without written permission, so this
  # image is built and checked here and published nowhere. What is uploaded is a workflow
  # artifact of records and source -- not a release asset.
  #
  # sudo for the chroot recipes, as the boot job does. git reads the runner's checkout
  # under sudo because sudo sets SUDO_UID, which git accepts as the owner; the provenance
  # would otherwise record no commit, and release-assets would refuse the image for it.
  tor-assets:
    name: tor assets (built, verified, never published)
    runs-on: ubuntu-24.04
    needs: build
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: {submodules: true}
      - name: install toolchain
        run: |
          sudo apt-get update -qq
          cat containers/packages/build.txt \
            | grep -v -e '^#' -e '^$' \
            | xargs sudo apt-get install -y --no-install-recommends
      - uses: actions/cache@v6
        with:
          path: isos/slax-64bit-debian-12.2.0.iso
          key: iso-debian-64bit-12.2.0-${{ hashFiles('compat/sources.yaml') }}
      - run: ./kitchen fetch debian-64bit-12.2.0
      - name: build tor
        run: |
          sudo ./kitchen build tor
          sudo chown -R "$(id -u):$(id -g)" out
      - name: assemble assets, without the image
        run: ./ci/release-assets.sh out/slax-tor-12.2.0.iso out/tor-assets --no-image
      - name: verify, and refuse any asset that is an image or executable by content
        run: ./ci/release-verify.py out/tor-assets --assert-no-images
      # Only the verified directory. Not out/, which holds the ISO.
      - uses: actions/upload-artifact@v7
        with:
          name: tor-assets
          path: out/tor-assets/
          if-no-files-found: error

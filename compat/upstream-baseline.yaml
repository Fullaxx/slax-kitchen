# The releases upstream had published when we last checked. ci/upstream-watch.sh compares the
# slax.org changelog against this and exits 1 on a newer release, the signal to re-run
# `kitchen probe`, regenerate fingerprints and work through docs/70-compat/. A dead mirror
# (compat/sources.yaml) or a rotated key (the recipes) exits 1 too.
#
# Upstream has shipped nothing since 2023-10-10, so a new release is genuinely notable.
# linux-live's own commits are compared with the vendor/linux-live pin instead, and
# reported without being flagged (#89). The pin is the only copy the watch reads, so moving it
# when a release is adopted is the only step.
apiVersion: slax-kitchen/v1
kind: UpstreamBaseline
# Slax ships TWO current releases, one per flavour, published the same day. The
# changelog lists both, so a single "latest version" string is meaningless here --
# the watch compares the whole set and reports anything not in it.
latest_releases:
  - "12.2.0"     # Debian-based
  - "15.0.4"     # Slackware-based
latest_release_date: "2023-10-10"
checked: "2026-10-22"

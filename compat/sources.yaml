# Where to download base ISOs. Curated by hand and kept SEPARATE from the generated
# fingerprints in this directory, so `kitchen fingerprint` regenerating one cannot
# clobber these URLs.
#
# The official download link (slax.org/download-slax.php) is not usable for automation:
# it 302s to a one-shot token URL on a third-party host. The author's own mirror serves
# the same files at stable, versioned paths -- verified byte-for-byte identical.
#
# sha256 and size are the authority. `kitchen fetch` verifies both and refuses anything
# that does not match, so an untrustworthy mirror cannot poison a build.
apiVersion: slax-kitchen/v1
kind: Sources

mirrors:
  - name: ftp.linux.cz
    base: https://ftp.linux.cz/pub/linux/slax
    layout: "{tree}/{file}"

targets:

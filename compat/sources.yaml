# Where to download base ISOs. Curated by hand and kept SEPARATE from the generated
# fingerprints in this directory, so `kitchen fingerprint` regenerating one cannot
# clobber these URLs.
#
# The official download link (slax.org/download-slax.php) is not usable for automation:
# it 302s to a one-shot token URL on a third-party host. Both mirrors below serve the
# same files at stable paths -- every one verified byte-for-byte against the canonical
# release.
#
# sha256 and size are the authority. `kitchen fetch` verifies both after every download
# and deletes anything that does not match before falling through to the next mirror,
# so an untrustworthy mirror cannot poison a build. Mirror ORDER is therefore a
# courtesy and throughput decision, not a trust one.
#
# images.rapidlinux.org is listed first because CI pulls ~1.8 GB across four parallel
# matrix jobs whenever the cache is cold, and ftp.linux.cz is a volunteer community
# mirror -- pointing bulk automation at it by default is impolite. It remains the
# canonical fallback.
#
# Adding a mirror needs no code change: lib/fetch.py iterates this list in order, and
# `layout` is a str.format template over the target's own keys, so a flat "{file}"
# works as well as "{tree}/{file}". ci/upstream-watch.sh HEADs every target on every
# mirror weekly, so a new entry here is monitored for rot automatically.
apiVersion: slax-kitchen/v1
kind: Sources

mirrors:
  # Verified 2026-09-13: all four ISOs HTTP/2 200, size exact, sha256 exact,
  # Range honoured (206 Partial Content), TLS valid, ~27 MB/s.
  - name: images.rapidlinux.org
    base: https://images.rapidlinux.org/slax_isos
    layout: "{file}"
  - name: ftp.linux.cz
    base: https://ftp.linux.cz/pub/linux/slax
    layout: "{tree}/{file}"

targets:
  debian-64bit-12.2.0:
    file: slax-64bit-debian-12.2.0.iso
    tree: Slax-Debian-12.x
    size: 435853312
    sha256: 61d9fdcc006938d6fd6f231e22d8af926ae8f48fdf0487b8010e69f3bd17cf70
  debian-32bit-12.2.0:
    file: slax-32bit-debian-12.2.0.iso
    tree: Slax-Debian-12.x
    size: 436060160
    sha256: 03b85cd259883f6781b3a3f30ed409b0b6a542b8f510094594c7600bd94e546b
  slackware-64bit-15.0.4:
    file: slax-64bit-slackware-15.0.4.iso
    tree: Slax-Slackware-15.x
    size: 476710912
    sha256: f5c26dfc275bbdccbaf8d3b90853ad1f3322f09c524c871dd3926356d2224a46
  slackware-32bit-15.0.4:
    file: slax-32bit-slackware-15.0.4.iso

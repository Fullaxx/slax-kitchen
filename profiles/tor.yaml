apiVersion: slax-kitchen/v1
kind: Profile
metadata:
  name: tor
  summary: Tor Browser instead of Chromium, on a UEFI-bootable hybrid ISO
base:
  flavour: debian
  arch: 64bit
  version: "12.2.0"
recipes:
  # REMOVAL IS ITS OWN RECIPE, AND GOES FIRST. A bundle is built against everything below
  # it, so removing one afterwards can strand it; check_plan_order refuses that order
  # before anything is modified. Nothing else here removes anything, so the rest of this
  # list composes in any order.
  - name: remove-bundle
    vars: {drop: "^05-chromium\\.sb$"}
  # Chromium goes because this image is Tor Browser's: shipping a browser that leaks
  # beside one that does not would defeat the point. Do not add all-browsers,
  # debian-browsers, chromium-current or firefox-esr either -- each is an alternative to
  # this, not an addition.
  - tor-browser
  # testkit prints facts about the ASSEMBLED filesystem to the serial console just before
  # change_root. Here it is carrying a specific claim: that `bundles:` no longer lists
  # 05-chromium.sb and that the merged dpkg count moved with it.
  #
  # It is instrumentation, not a feature. A profile meant to be HANDED to somebody would
  # drop this line -- nothing is published today, so it stays.
  - testkit
  - serial-console
  - isohybrid
  # uefi-bootable builds the GRUB menu by parsing isolinux.cfg, so it runs after anything
  # that adds a menu entry. Keep it last.
  - uefi-bootable
output:
  name: "slax-tor-{{version}}.iso"
  hybrid: true
test:
  - structure

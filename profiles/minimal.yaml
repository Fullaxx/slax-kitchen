apiVersion: slax-kitchen/v1
kind: Profile
metadata:
  name: minimal
  summary: Smallest useful Slax -- no browser, no dev tools, still boots to a desktop
base:
  flavour: debian
  arch: 64bit
  version: "12.2.0"
recipes:
  # The pattern is spelled out rather than left to the recipe's default: a profile line
  # that deletes something should say what.
  - name: remove-bundle
    vars: {drop: "^05-chromium\\.sb$"}
  - rootcopy-overlay
output:
  name: "slax-minimal-{{version}}.iso"
test:
  - structure

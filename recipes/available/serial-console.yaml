apiVersion: slax-kitchen/v1
kind: Recipe
metadata:
  name: serial-console
  summary: Add a boot entry that logs the whole boot to the serial port
  tags: [boot, testing, headless]
compat:
  flavours: [debian, slackware]
  arch: [32bit, 64bit]
  slax: ">=12.0.0"
  privilege: none
vars:
  port: ttyS0
  speed: "115200"
steps:
  # A serial entry is the prerequisite for every automated boot test: QEMU can capture
  # ttyS0 with -nographic, so the livekit init messages become machine-readable. The
  # stock menu has no such entry, which is why boot testing needs this first.
  #
  # ORDER OF THE TWO console= CLAUSES, and it is the whole recipe.
  #
  # Linux sends KERNEL messages to every console= it is given, but /dev/console -- where
  # USERSPACE writes -- is the LAST one only. This entry used to end
  # `console=ttyS0,115200n8 console=tty0`, putting /dev/console on video. Measured on
  # 2026-09-16: booting this entry through isolinux and capturing ttyS0 produced 21 KB
  # of kernel log and ZERO livekit markers -- `Looking for slax data`, `Mounting
  # bundles`, `Live Kit done` and the entire testkit block went to the screen, because
  # livekitlib writes them to stderr. The same image in direct-kernel mode, whose
  # cmdline names ttyS0 alone, produced all four.
  #
  # So the summary above -- "logs the whole boot to the serial port" -- was false for
  # every line worth capturing, and so was the claim that this is "the prerequisite for
  # every automated boot test": nothing could assert on an entry that carried no
  # userspace output. tty0 now comes first and the serial port last, which makes the
  # entry do what its name says. The screen still shows kernel messages; what moves is
  # /dev/console, and therefore login and everything init prints.
  #
  # COPIED FROM `default`, NOT WRITTEN OUT. This entry used to spell out stock Slax's
  # command line, `automount` included, so it carried none of the edits made before it:
  # after boot-cmdline it kept `automount` and lacked `toram`, and on an image whose own
  # build had removed `automount` -- the flag issue 12 says cannot be negated -- it put it
  # back (#50). `from: default` copies each file's default entry as it stands; the two
  # console= tokens replace any console= it has. On the stock menus the isolinux.cfg entry
  # is byte-for-byte the one this recipe wrote before, which is the entry the boot tests
  # booted. In syslinux.cfg it also carries the default's `perchdir=resume`, so on a USB
  # install it resumes the saved session as the default entry does.
  - verb: boot.menu
    targets: [isolinux.cfg, syslinux.cfg]
    add:
      label: serial
      menu_label: "Slax (serial console on {{port}})"
      from: default
      append: "console=tty0 console={{port}},{{speed}}n8"

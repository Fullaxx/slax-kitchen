apiVersion: slax-kitchen/v1
kind: Recipe
metadata:
  name: branding
  summary: Set the hostname, version string and login banner from a high-numbered bundle
  tags: [bundle, branding, template]
compat:
  flavours: [debian, slackware]
  arch: [32bit, 64bit]
  slax: ">=12.0.0"
  privilege: none
vars:
  hostname: slax-custom
  version: "Slax 12.2.0 (customized)"
  # A var, not an inline literal, so a fork can move it from a profile:
  #   - name: branding
  #     vars: {bundle: 20-branding}
  # recipes-in-a-fork.md has documented that escape hatch since it was written, and
  # this was the one shipped recipe it did not work on: validate.py rejects an override
  # naming a var the recipe does not declare, so `bundle:` here was unreachable.
  bundle: 07-branding
steps:
  # Override rather than edit. All three files live in 01-core.sb, and a bundle numbered
  # above it wins in the union -- so the shipped bundle stays byte-identical, `kitchen
  # probe` still reports it as stock, and the whole change is reversible by deleting one
  # 4 KiB file. Unpacking and repacking a 122 MiB bundle to change three text files would
  # be the wrong trade.
  #
  # 07: branding adjusts the platform rather than adding content, so it belongs in the
  # 00-09 band. See docs/10-anatomy/bundles-squashfs.md for the whole scheme.
  - verb: bundle.files
    bundle: "{{bundle}}"
    files:
      - dest: /etc/hostname
        content: "{{hostname}}\n"

      - dest: /etc/slax-version
        content: "{{version}}\n"

      # /etc/issue is what prints the root/toor banner on tty1. Keeping the credentials
      # visible is deliberate: this is a live system whose password is public anyway, and
      # silently hiding it makes the image harder to use, not safer. Change the password
      # with a users-and-auth recipe if that matters.
      - dest: /etc/issue
        content: |
          {{version}} \l

          login: root   password: toor

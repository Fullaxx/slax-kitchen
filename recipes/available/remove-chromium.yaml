apiVersion: slax-kitchen/v1
kind: Recipe
metadata:
  name: remove-chromium
  summary: Remove the Chromium bundle, saving 79-115 MiB
  tags: [bundle, size, browser]
compat:
  flavours: [debian, slackware]
  arch: [32bit, 64bit]
  slax: ">=12.0.0"
  privilege: none
steps:
  # 05-chromium.sb is the single largest optional bundle: 79 MiB on Debian, 115 MiB on
  # Slackware -- roughly a fifth of the ISO. This is a zero-configuration preset; use the
  # generic `remove-bundle` recipe if you want to drop something else or several at once.
  #
  # The desktop keeps its "Web Browser" entry on purpose. Slax routes it through
  # /usr/bin/fbliveapp, which checks whether /usr/bin/chromium exists and offers to
  # install it if not -- so the launcher degrades into an on-demand installer rather
  # than breaking. That is upstream's design, not a leftover.
  #
  # How it recovers differs by flavour, which matters if the target has no network:
  #   debian     apt install --yes chromium chromium-sandbox
  #   slackware  wget the 05-chromium.sb from slax.org, then `slax activate` it
  #
  # On an air-gapped build, remove the launcher too -- see the cookbook page.
  - verb: bundle.remove
    match: "^05-chromium\\.sb$"

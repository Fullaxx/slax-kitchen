apiVersion: slax-kitchen/v1
kind: Recipe
metadata:
  name: firmware-refresh
  summary: Firmware so the ISO works on more hardware -- Debian's, plus what only linux-firmware has
  tags: [firmware, hardware, bundle]
compat:
  # Debian only, for the reasons add-packages documents: Slackware has no
  # dependency-resolving package manager and its stock mirror points at -current, years
  # past this frozen base. The Slackware route is a pinned kernel-firmware .txz -- see
  # the cookbook page.
  flavours: [debian]
  arch: [32bit, 64bit]
  slax: ">=12.0.0"
  privilege: chroot
vars:
  # Two bundles, and the names are chosen for their ORDER. sortmod sorts by number, then
  # by full name, and "09-firmware-debian.sb" < "09-firmware-linux.sb": the linux-firmware
  # step therefore builds on top of the Debian one, so its refusal to shadow an existing
  # file (below) can see everything Debian just installed. "09-firmware-extra" would have
  # sorted BEFORE "09-firmware.sb" ('-' < '.') and seen none of it.
  bundle: 09-firmware-debian
  linux_bundle: 09-firmware-linux
  linux_firmware_tag: "20260916"
steps:
  # WHAT THIS IS FOR: an ISO that works on more hardware. A kernel driver without its
  # firmware is a device that does not work -- a black screen on a modern AMD card,
  # silent speakers on a SOF laptop, Wi-Fi that never associates -- and it looks like a
  # Slax bug when it is not one. The kernel's own driver set decides which firmware can
  # matter at all, so the lists below are MEASURED from it, not guessed:
  #
  #   tools/firmware-coverage.py <freshly unpacked stock debian-64bit>/iso [--recipe]
  #
  # reads every `firmware=` the 6.1.38 modules declare (1,959 names), what the stock image
  # already has (295), what bookworm's packages ship (1,534), and what linux-firmware
  # carries at the tag. Measured 2026-09-17; rerun it when the base or the tag moves.
  #
  # DEBIAN FIRST, AS DEBIAN SHIPS IT. A package is here if it ships at least one requested
  # file the image lacks, or is a runtime family (SOF and Intel SST audio, and
  # wireless-regdb, whose files drivers ask for by name at runtime). The tool's EXCLUDE
  # table says why each other firmware package in the suite is not: ARM-only and
  # Raspberry Pi firmware, NVIDIA GSP (for a proprietary driver Slax lacks), CPU microcode
  # (must load from the initramfs), and firmware-ivtv, whose debconf licence prompt
  # would stop an unattended install.
  #
  # THE STOCK FIRMWARE IS REINSTALLED, which needs `reinstall: true`. The stock image
  # already carries firmware-atheros, -iwlwifi, -realtek and seven more at the version
  # bookworm still has (20230210-5; bookworm-updates has nothing newer), so a plain
  # install of them does nothing -- this recipe used to list four of them, and measured,
  # none reached its bundle. What the stock copies lack is their /usr/share/doc: Slax's
  # cleanup deleted every copyright file. A reinstall brings Debian's back and nothing
  # else, because unchanged files stay out of the delta: ten packages, 64 KiB, 32 files,
  # and each copyright byte-identical to the md5 dpkg recorded in the stock image.
  # firmware-ipw2x00 is left alone -- its licence prompt would stop the install, and its
  # ipw2x00.LICENSE is still in the stock image -- and so is firmware-b43-installer, a
  # downloader whose host (www.lwfinger.com) no longer resolves; stock already carries
  # the firmware it extracted.
  #
  # Nothing here replaces 01-firmware.sb. It stays, b43 blobs included.
  - verb: bundle.packages
    bundle: "{{bundle}}"
    apt:
      update: true
      # Firmware packages Recommend other firmware packages; without this the closure is
      # far larger than the list below and much of it is for hardware that cannot be in
      # a machine that also has the rest.
      no_recommends: true
      reinstall: true
    packages:
      - atmel-firmware                 # 20 requested files the image lacks
      - bluez-firmware                 # 2
      - firmware-amd-graphics          # 751 -- amdgpu/radeon; stock has no GPU firmware at all
      - firmware-ast                   # 1
      - firmware-ath9k-htc             # 2
      - firmware-bnx2x                 # 6
      - firmware-intel-sound           # runtime family: Intel SST/SOF audio DSP
      - firmware-misc-nonfree          # 429 -- i915, nvidia (nouveau), mediatek, and more
      - firmware-myricom               # 4
      - firmware-netronome             # 8
      - firmware-netxen                # 1
      - firmware-qlogic                # 10
      - firmware-realtek-rtl8723cs-bt  # 2
      - firmware-siano                 # 13
      - firmware-sof-signed            # runtime family: Sound Open Firmware, most laptops since ~2019
      - wireless-regdb                 # runtime family: regulatory.db for every Wi-Fi device
      - firmware-atheros               # stock; reinstalled for its copyright file
      - firmware-bnx2                  # stock; reinstalled
      - firmware-brcm80211             # stock; reinstalled
      - firmware-cavium                # stock; reinstalled
      - firmware-iwlwifi               # stock; reinstalled
      - firmware-libertas              # stock; reinstalled
      - firmware-linux-free            # stock (in 01-core); reinstalled
      - firmware-realtek               # stock; reinstalled
      - firmware-ti-connectivity       # stock; reinstalled
      - firmware-zd1211                # stock; reinstalled

  # WHAT NO DEBIAN PACKAGE SHIPS, FROM LINUX-FIRMWARE -- 425 requested names, of which the
  # tag carries 71. Taken: the 59 whose WHENCE entry names a license file, and that file
  # travels with the copy (under LICENSES/, where the tag keeps them, with WHENCE beside
  # it saying which entry each covers). Left out: the 12 whose entry says only "Allegedly
  # GPL ... but no source visible", because there is no license file to bring. Most of
  # the rest were never published anywhere.
  #
  # NEVER A REPLACEMENT FOR A DEBIAN FILE. The list is computed against every file every
  # bookworm package ships, and the script refuses any path that already exists below
  # this bundle -- so Debian's copy, when there is one, is the only copy.
  #
  # FETCHED PER FILE, PINNED PER FILE. The release tarball is 662 MB for these 65 files.
  # GitLab is linux-firmware's own home and git.kernel.org carries the same tag; mirrors
  # are tried in order and sha256 is the authority, the rule lib/fetch.py follows.
  # git.kernel.org answered 503 to a burst of sequential requests while this list was
  # measured, which is why neither is trusted to be up on its own. A file that no
  # mirror serves, or that fails its hash, fails the build: a partial firmware set that
  # says it is complete is worse than a red build.
  - verb: bundle.script
    bundle: "{{linux_bundle}}"
    network: true
    script: |
      #!/bin/sh
      set -eu
      TAG="{{linux_firmware_tag}}"
      DEST=/usr/lib/firmware
      TMP=$(mktemp -d)
      SRC=""

      fetch() {
          for url in "https://gitlab.com/kernel-firmware/linux-firmware/-/raw/$TAG/$1" \
                     "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/$1?h=$TAG"; do
              if wget -q --tries=3 --waitretry=5 --timeout=60 -O "$TMP/f" "$url"; then
                  SRC=$url
                  return 0
              fi
          done
          return 1
      }

      n=0
      while read -r kind path arg; do
          if [ -e "$DEST/$path" ] || [ -L "$DEST/$path" ]; then
              echo "firmware-refresh: $path already exists below this bundle; refusing to shadow it" >&2
              exit 1
          fi
          mkdir -p "$DEST/$(dirname "$path")"
          case "$kind" in
              file)
                  fetch "$path" || { echo "firmware-refresh: no mirror served $path" >&2; exit 1; }
                  got=$(sha256sum "$TMP/f" | cut -d' ' -f1)
                  if [ "$got" != "$arg" ]; then
                      echo "firmware-refresh: $path has sha256 $got, pinned $arg" >&2
                      exit 1
                  fi
                  install -m 0644 "$TMP/f" "$DEST/$path"
                  # Read by bundle.script into the image's provenance: what came from where.
                  echo "KITCHEN-FETCHED $got usr/lib/firmware/$path $SRC"
                  ;;
              link)
                  ln -s "$arg" "$DEST/$path"
                  ;;
              *)
                  echo "firmware-refresh: bad manifest line: $kind $path" >&2
                  exit 1
                  ;;
          esac
          n=$((n + 1))
      done <<'MANIFEST'
      file amdgpu/gc_11_0_0_mes_2.bin 6e1926d197d9e5f17830c1bba661ac170e2c9e7aba1da56ef26c6f6978b3b79e

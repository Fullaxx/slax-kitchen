apiVersion: slax-kitchen/v1
kind: Recipe
metadata:
  name: chromium-current
  summary: Current Chromium from bookworm-security, over Slax's 2023 build
  tags: [browser, security, bundle]
compat:
  flavours: [debian]
  arch: [32bit, 64bit]
  slax: ">=12.0.0"
  privilege: chroot
vars:
  # 10, not 06: above every stock bundle and above the 00-09 platform band. That puts it
  # in 10-89, which is a FORK's range rather than slax-kitchen's -- deliberately, because
  # installing an application is downstream work and this recipe is an example of it.
  # `bundle` is a var, so a profile can move it. 98 and 99 are refused outright; see
  # docs/10-anatomy/bundles-squashfs.md for why those two are not just ordering.
  bundle: "10-chromium"
steps:
  # WHY THIS RECIPE EXISTS. Both flavours ship chromium 117.0.5938.149, released in
  # September 2023. It is the single most exposed thing in the image -- a browser is
  # what a live system is mostly used for -- and it is years of security fixes behind.
  #
  # NO APT SOURCE CHANGES ARE NEEDED. The stock /etc/apt/sources.list already carries
  # bookworm-security, which is where the current build lives (150.0.7871.100-1~deb12u1
  # at the time of writing, available for both amd64 and i386).
  #
  # IT ONLY ADDS, SO PAIR IT WITH A REMOVAL and list that first:
  #
  #   - name: remove-bundle
  #     vars: {drop: "^05-chromium\\.sb$"}
  #
  # This bundle is 10 and shadows 05, so the browser you get is the current one either
  # way. What the removal buys is the 79 MiB the 2023 copy occupies, and the files it has
  # that the current build does not -- a bundle can add and replace, but it cannot delete,
  # so those stay visible in the union while 05 is there.
  #
  # `from:` follows from that, and this recipe is the clearest place to see the dial:
  # with 05-chromium removed first, the stack is 01-core .. 04-apps, the 22 media and
  # crypto libraries that came with the old Chromium are gone with it, and apt pulls the
  # current versions in -- a self-contained bundle. With 05 still below, apt finds those
  # libraries installed and ships fewer of them, which is smaller and assumes 05 stays.
  # Both are correct; see docs/40-workflow/composing-bundles.md.
  #
  # Naming a shorter stack here would be a mistake either way: apt would reinstall
  # libraries 02-xorg already provides, and this bundle outranks 02-xorg, so its copies
  # would win.
  - verb: bundle.packages
    bundle: "{{bundle}}"
    packages: [chromium, chromium-sandbox]

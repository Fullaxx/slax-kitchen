apiVersion: slax-kitchen/v1
kind: Recipe
metadata:
  name: add-packages
  summary: Install extra distro packages into a new bundle (the template recipe)
  tags: [bundle, packages, template]
compat:
  # Debian only, deliberately. The Slackware path is implemented and does work -- it
  # builds a correct, bootable bundle -- but it cannot be *relied* on, for two reasons
  # outside this repo's control: Slackware has no dependency resolution, and the stock
  # mirror is -current which has drifted years past this 2023 base.
  # See docs/50-cookbook/add-packages.md.
  flavours: [debian]
  arch: [32bit, 64bit]
  slax: ">=12.0.0"
  privilege: chroot
vars:
  bundle: 07-extras
steps:
  # Copy this recipe and change `packages`. The build root is stacked from the ISO's own
  # bundles, so there is no debootstrap and no external base image, and the result is
  # guaranteed to match the shipped kernel's ABI.
  #
  # The bundle number matters: load order is the numeric prefix and HIGHER WINS, because
  # union_append_bundles inserts each branch at aufs index 1. Stock bundles occupy 01-06
  # and savechanges writes 99-changes-N.sb, so 07 overrides everything stock while still
  # losing to a user's saved session.
  #
  # Needs real chroot. proot cannot be used -- it does not translate statx() and silently
  # reads the host filesystem instead. See docs/40-workflow/edit-bundles.md.
  #
  # The package lists differ per flavour because the names do: ncdu is in Debian proper
  # but only in third-party Slackware repos, and slackpkg does no dependency resolution
  # at all (neither does Slackware itself), so every dependency must be named explicitly.
  #
  # NO `from:` HERE ON PURPOSE. It now defaults to every bundle that will sit below this
  # one at boot. Naming a shorter stack makes apt reinstall libraries the image already
  # has, and those copies then shadow the originals -- see docs/40-workflow/composing-bundles.md.
  - verb: bundle.packages
    when: flavour==debian
    bundle: "{{bundle}}"
    packages: [tmux, ncdu]
    apt:
      update: true
      no_recommends: true

  # A Slackware step would look like the below. It is left commented out because the
  # flavour is unsupported, not because it fails -- see the cookbook page. If you enable
  # it, name every transitive dependency yourself and pin a mirror:
  #
  #   - verb: bundle.packages
  #     when: flavour==slackware
  #     bundle: "{{bundle}}"
  #     packages: [tmux, libevent]
  #     mirror: https://mirrors.slackware.com/slackware/slackware64-15.0/

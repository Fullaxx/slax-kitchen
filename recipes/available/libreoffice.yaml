apiVersion: slax-kitchen/v1
kind: Recipe
metadata:
  name: libreoffice
  summary: Add LibreOffice Writer, Calc and Impress — the largest single addition here
  tags: [bundle, packages, office]
compat:
  # Debian only. Slackware has no official LibreOffice package -- it is an AlienBOB
  # build -- and slackpkg points at a mirror years ahead of the frozen 2023 base, so
  # anything installed from it may not run. See docs/50-cookbook/libreoffice.md.
  flavours: [debian]
  arch: [32bit, 64bit]
  slax: ">=12.0.0"
  privilege: chroot
vars:
  # 12: above the stock 01-06 and above the browsers at 10-11, below the generated
  # 98-dpkg-db and a saved session at 99. 10-89 is a FORK's range rather than
  # slax-kitchen's -- deliberately, since this is an example of downstream work.
  bundle: 12-libreoffice
steps:
  # TWO CHOICES HERE ARE DELIBERATE, and neither is the one you would guess.
  #
  # 1. THREE APPLICATIONS, NOT THE `libreoffice` METAPACKAGE -- and NOT for size.
  #    Measured on debian-64bit: this set is 116.2 MiB and the metapackage is 129.0
  #    MiB. Thirteen megabytes is not worth a decision.
  #
  #    The real reason is that the metapackage gives you a Base THAT CANNOT OPEN A
  #    DATABASE. Base needs a JRE, and `default-jre` is a Recommends rather than a
  #    Depends -- so under --no-install-recommends apt installs the application and
  #    leaves out the runtime it needs, without complaining. Measured: the metapackage
  #    pulls 121 packages and not one of them is a JRE. Shipping something that looks
  #    installed and fails when clicked is worse than not shipping it.
  #
  #    And you cannot simply add the JRE: openjdk's postinst runs `java`, which will
  #    not start without a mounted /proc, and the build chroot only has an empty
  #    directory there. See the cookbook page.
  #
  #    Draw arrives as a dependency regardless, so this is really four applications.
  #
  # 2. TWO RECOMMENDS ARE NAMED EXPLICITLY, because bundle.packages installs with
  #    --no-install-recommends and would otherwise skip them:
  #
  #      libreoffice-gtk3   without it LibreOffice falls back to the "gen" VCL
  #                         backend -- it runs, but draws its own widgets, ignores the
  #                         desktop theme and has no native file dialog. The difference
  #                         between usable and merely present.
  #      hunspell-en-us     a word processor with no spell checker is a strange thing
  #                         to ship, and it is under a megabyte.
  #
  #    The same reasoning applies to fonts-crosextra-carlito and -caladea, which are
  #    metric-compatible with Calibri and Cambria; left out because they only matter if
  #    you open documents authored in Microsoft Office. The cookbook page says how.
  - verb: bundle.packages
    bundle: "{{bundle}}"
    packages:
      - libreoffice-writer
      - libreoffice-calc
      - libreoffice-impress
      - libreoffice-gtk3
      - hunspell-en-us

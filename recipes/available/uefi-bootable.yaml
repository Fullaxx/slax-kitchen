apiVersion: slax-kitchen/v1
kind: Recipe
metadata:
  name: uefi-bootable
  summary: Make the ISO boot on UEFI firmware, which the stock ISO cannot do
  tags: [boot, uefi, flagship]
compat:
  flavours: [debian, slackware]
  arch: [32bit, 64bit]
  slax: ">=12.0.0"
  privilege: none
vars:
  # Seconds GRUB waits before booting the default entry. Five is upstream-ish and fine
  # for a person; an automated boot has to REACH this menu before it expires, and under
  # TCG OVMF spends about nine seconds in firmware before GRUB draws anything. Raise it
  # for an image a test harness drives -- profiles/boot-matrix.yaml does.
  menu_timeout: "5"
steps:
  # The stock El Torito catalog has exactly ONE entry, platform 0x00 (x86 BIOS). There
  # is no 0xEF section header and no EFI System Partition, so UEFI firmware has nothing
  # to boot. /slax/boot/EFI/Boot/bootx64.efi does exist -- but it is a copy of
  # syslinux.efi, which can only read FAT, and bootinst.sh relocates it to the root of a
  # FAT USB stick. On the ISO9660 filesystem it is unreachable dead weight.
  #
  # This adds a small FAT ESP holding GRUB instead, because GRUB can read iso9660: the
  # kernel and initramfs stay where they are on the ISO and only BOOTX64.EFI lives in
  # the ESP. The GRUB menu is generated from isolinux.cfg, so entries added by other
  # recipes are mirrored automatically -- which is why this recipe should run last.
  #
  # The EFI BINARY is x86_64 only -- upstream ships no bootia32.efi and neither do we --
  # which is a statement about the FIRMWARE, not about the target. A 32-bit UEFI machine
  # is not covered. A 64-bit one booting the 32-bit ISO is: measured 2026-09-16, OVMF
  # loads BOOTX64.EFI, GRUB 2.12 boots the i686 kernel, and livekit reaches all three
  # markers in six seconds. So `arch: [32bit, 64bit]` above is right, and this note used
  # to read as if it were not.
  - verb: boot.uefi
    timeout: "{{menu_timeout}}"
